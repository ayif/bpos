services:
  postgres:
    image: postgres:16-alpine
    container_name: bpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bpos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bpos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bpos-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - bpos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bpos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bpos}:${POSTGRES_PASSWORD:-bpos_secret}@postgres:5432/${POSTGRES_DB:-bpos}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DIGIFLAZZ_USERNAME: ${DIGIFLAZZ_USERNAME:-}
      DIGIFLAZZ_API_KEY: ${DIGIFLAZZ_API_KEY:-}
      DIGIFLAZZ_MODE: ${DIGIFLAZZ_MODE:-mock}
      DIGIFLAZZ_TESTING: ${DIGIFLAZZ_TESTING:-false}
      DIGIFLAZZ_CALLBACK_TOKEN: ${DIGIFLAZZ_CALLBACK_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - bpos_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bpos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  bpos_pg_data:
  bpos_redis_data:
  bpos_uploads:
